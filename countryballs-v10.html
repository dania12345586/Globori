    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
      }
      canvas {
        display: block;
        outline: none;
        width: 960px;
        height: 720px;
      }
      canvas:focus-visible {
        outline: 1px solid #49434e;
        outline-offset: 3px;
      }
      #reader {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      body { overscroll-behavior: none; }
      #game-stage { width: 100%; height: 100%; display: grid; place-items: center; min-height: 0; min-width: 0; }
      #game { touch-action: none; }
      #touch-controls { display: none; }
      body.touch-mode { height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #100f15; }
      .touch-mode #game-stage { flex: 1; }
      .touch-mode #touch-controls { display: flex; flex: 0 0 180px; justify-content: space-between; align-items: center; width: 100%; padding: 12px 20px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #joystick { position: relative; width: 132px; height: 132px; flex: 0 0 132px; border-radius: 50%; border: 2px solid #696275; background: #24212e; touch-action: none; }
      #joystick::before { content: '＋'; position: absolute; inset: 0; display: grid; place-items: center; color: #a39aae; font: 58px system-ui; }
      #stick { position: absolute; left: 37px; top: 37px; width: 54px; height: 54px; border-radius: 50%; background: #635b73; border: 2px solid #c6bbd6; pointer-events: none; box-shadow: 0 3px 8px #0005; }
      #joystick.active #stick { background: #88749e; border-color: #f1e8ff; }
      #action-buttons { display: grid; grid-template-columns: repeat(2, 62px); gap: 8px; }
      .game-button { width: 62px; height: 62px; border-radius: 50%; background: #292432; border: 2px solid #8c809c; color: #f5eefb; font: 700 22px system-ui; touch-action: none; padding: 0; -webkit-tap-highlight-color: transparent; }
      .game-button span { display: block; font: 10px/14px system-ui; color: #e0d5eb; }
      .game-button[data-code="KeyZ"] { grid-column: 2; grid-row: 1; background: #44334f; border-color: #b99bd1; }
      .game-button[data-code="KeyX"] { grid-column: 1; grid-row: 2; }
      .game-button[data-code="KeyC"] { grid-column: 2; grid-row: 2; }
      .game-button.pressed { background: #78598f; border-color: #fff; transform: scale(.95); }
      .game-button:focus-visible, #joystick:focus-visible { outline: 3px solid #e3c5ff; outline-offset: 3px; }
      @media (orientation: landscape) {
        .touch-mode #game-stage { width: calc(100% - 248px); margin: 0 124px; }
        .touch-mode #touch-controls { position: absolute; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); width: auto; padding: 8px; pointer-events: none; }

   Рамки из скриншота больше НЕ встроены; нет внешней рамки вокруг рамки.
   Если PNG отсутствует, рисуется один временный контур с фоном.
   Размер/позицию портрета можно изменить в FRAME_LAYOUT.

            smoke.addColorStop(0, '#e2dcda');
            smoke.addColorStop(1, '#d5cfd000');
            ctx.fillStyle = smoke;
            ctx.beginPath();
            ctx.ellipse(x, y, radius, radius * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      function drawFX() {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const f of state.effects) {
          const t = (clock - f.start) / f.life;
          if (t < 0 || t > 1) continue;
          const p = pointOf(f.target),
            enemy = isEnemy(f.target),
            r = enemy ? (f.target.minion ? 26 : state.minions.length ? 52 : 69) : 30,
            alpha = Math.sin(Math.PI * Math.min(1, t)) * 0.96;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.globalAlpha = alpha;
          if (['saber', 'dagger'].includes(f.type)) {
            drawBladeFX(f, t, r);
          } else if (f.type === 'musket' || f.type === 'tufek') {
            drawGunFX(f, t);
          } else if (f.type === 'link' || f.type === 'relay') {
            const source = pointOf(f.source),
              dx = source.x - p.x,
              dy = source.y - p.y;
            if (f.type === 'relay') {
              const q = smoothStep(t),
                x = dx * (1 - q),
                y = dy * (1 - q);
              line(ctx, x + dx * 0.1, y + dy * 0.1, x, y, '#ffe8ac', 2.5);
              ctx.fillStyle = '#fff5c8';
              ctx.beginPath();
              ctx.arc(x, y, 4, 0, Math.PI * 2);
              ctx.fill();
            } else {
              line(ctx, dx, dy, 0, 0, '#f5df9d88', 2);
              for (let i = 0; i < 4; i++) {
                const q = (t + i / 4) % 1;
                star(ctx, dx * (1 - q), dy * (1 - q), 3, '#fff0bc', 4);
              }
            }
          } else if (['comboCut', 'hussarCharge', 'dash', 'ram'].includes(f.type)) {
            drawSpecialFX(f, t, r);
          } else if (f.type === 'impact') {
            ctx.strokeStyle = '#ffe9bf';
            for (let i = 0; i < 9; i++) {
              const a = (i * Math.PI * 2) / 9,
                d = (12 + t * 32) * (f.power || 1);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * d * 0.5, Math.sin(a) * d * 0.5);
              ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
              ctx.stroke();
            }
          } else if (f.type === 'heal' || f.type === 'juice' || f.type === 'casting') {
            const col = f.type === 'juice' ? '#9ce6ff' : '#aaf7bd';
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(0, 25 - t * 18, 15 + t * 30, 5 + t * 8, 0, 0, Math.PI * 2);
            ctx.stroke();
            for (let i = 0; i < 9; i++) {
              const q = (t + i * 0.13) % 1,
                x = Math.sin(i * 2.39) * (r * 0.85),
                y = 30 - q * 78;
              ctx.globalAlpha = Math.sin(q * Math.PI) * 0.85;
              const s = 2 + q * 2;
              rect(ctx, x - s, y, s * 2, 1.8, col);
              rect(ctx, x - 0.9, y - s, s ? 1.8 : 1.8, s * 2, col);
            }
          } else if (f.type === 'guard' || f.type === 'parry') {
            ctx.strokeStyle = f.type === 'parry' ? '#bcffee' : '#d5dfff';
            ctx.lineWidth = f.type === 'parry' ? 3 : 2;
            ctx.beginPath();
            ctx.moveTo(-r, -r * 0.7);
            ctx.quadraticCurveTo(0, -r * 1.35, r, -r * 0.7);
            ctx.quadraticCurveTo(r * 1.2, r * 0.5, 0, r * 1.2);
            ctx.quadraticCurveTo(-r * 1.2, r * 0.5, -r, -r * 0.7);
            ctx.stroke();
            if (f.type === 'parry') {
              ctx.rotate(0.7);
              line(ctx, -r * 1.1, 0, r * 1.1, 0, '#fff7d1', 3);
            }
          } else if (f.type === 'enemy') {
            ctx.strokeStyle = '#eadeff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, (r + 20) * (1 - ease(t)), 0, Math.PI * 2);
            ctx.stroke();
            for (let i = 0; i < 4; i++) {
              const a = (i * Math.PI) / 2 + t * 0.7;
              line(
                ctx,
                Math.cos(a) * (r + 18),
                Math.sin(a) * (r + 18),
                Math.cos(a) * (r + 2),
                Math.sin(a) * (r + 2),
                '#e8bde5',
                2,
              );
            }
          } else {
            const col =
              {
                happy: '#fff2a0',
                angry: '#ffb18d',
                sad: '#9bd7ff',
                calm: '#b8f7e0',
                diplomacy: '#d9bbf3',
              }[f.type] || '#efe3ff';
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(0, 8, r * 0.7 + t * 20, r * 0.4 + t * 16, 0, 0, Math.PI * 2);
            ctx.stroke();
            for (let i = 0; i < 7; i++) {
              const a = i * 2.4,
                rr = 18 + t * 29,
                x = Math.cos(a) * rr,
                y = Math.sin(a) * rr - t * 9;
              star(ctx, x, y, f.type === 'sad' ? 2 : 3, col, 4);
            }
          }
          ctx.restore();
        }
        for (const f of state.floats) {
          const t = (clock - f.start) / f.life,
            p = pointOf(f.target);
          ctx.save();
          ctx.globalAlpha = Math.min(1, (1 - t) * 3);
          const y =
              p.y -
              (isEnemy(f.target) ? 35 : 10) -
              (reduced ? 0 : ease(t) * 22) +
              (f.offsetY || 0),
            x = p.x + (f.offsetX || 0);
          text(ctx, f.text, x + 1, y + 1, 19, '#27182b', 'center', true);
          text(ctx, f.text, x, y, 19, f.color, 'center', true);
          ctx.restore();
        }
        ctx.restore();
      }

      function recoverFallen() {
        for (const c of state.party)
          if (c.hp <= 0) {
            c.hp = 1;
            c.downAt = undefined;
          }
      }
      function checkEnd() {
        if (state.result) return true;
        if (!state.polandDefeated && livingEnemies().length && alive().length) return false;
        state.result = state.polandDefeated || !alive().length ? 'lose' : 'win';
        state.followup = null;
        state.queue = [];
        action = null;
        // Определяем результат ДО восстановления, чтобы поражение не отменялось.
        recoverFallen();
        choose('result');
        msg(state.result === 'win' ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ.');
        AudioEngine.play(state.result === 'win' ? 'win' : 'lose');
        return true;
      }

      // --------------------- ГРАФИКА ------------------------------------
      // Координаты интерфейса логические 640×480; canvas рисуется в размере
      // экрана × DPR, поэтому векторные портреты не увеличиваются из 32×32.
      function rect(g, x, y, w, h, color) {
        g.fillStyle = color;
        g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }
      function line(g, x, y, x2, y2, color, width = 1) {
        g.strokeStyle = color;
        g.lineWidth = width;
        g.beginPath();
        g.moveTo(Math.round(x), Math.round(y));
        g.lineTo(Math.round(x2), Math.round(y2));
        g.stroke();
      }
      function text(g, t, x, y, size = 16, color = '#fff', align = 'left', instant = false) {
        t = String(t);
        const numeric = /^[+−\-]?\d[\d\s/+.JHP−\-]*$/.test(t);
        const shown =
          g === ctx && !instant && !numeric ? reveal(t, 'text:' + x + ':' + y + ':' + t) : t;
        g.fillStyle = color;
        g.font = `bold ${size}px monospace`;
        g.textAlign = align;
        g.textBaseline = 'top';
        g.fillText(shown, Math.round(x), Math.round(y));
        g.textAlign = 'left';
      }

      function wrap(t, width, size = 16) {
        ctx.font = `bold ${size}px monospace`;
        let out = [];
        for (const paragraph of t.split('\n')) {
          let row = '';
          for (const word of paragraph.split(' ')) {
            if (ctx.measureText((row ? row + ' ' : '') + word).width > width && row) {
              out.push(row);
              row = word;
            } else row += (row ? ' ' : '') + word;

          out.push(row);

        return out;
      }
      function textLines(t, x, y, width, size = 16, max = 10, color = '#fff') {
        const rows = wrap(t, width, size).slice(0, max),
          whole = rows.join('\n');
        let left = reveal(whole, 'lines:' + x + ':' + y).length;
        rows.forEach((r, i) => {
          const shown = r.slice(0, Math.max(0, left));
          left -= r.length + 1;
          text(ctx, shown, x, y + i * (size + 5), size, color, 'left', true);
        });
      }

      function box(x, y, w, h, fill = '#000') {
        rect(ctx, x, y, w, h, '#050305');
        rect(ctx, x + 2, y + 2, w - 4, h - 4, '#fff7ef');
        rect(ctx, x + 4, y + 4, w - 8, h - 8, '#201b29');
        rect(ctx, x + 6, y + 6, w - 12, h - 12, fill);
      }
      function cursor(x, y, color = '#fff') {
        rect(ctx, x, y + 3, 4, 10, color);
        rect(ctx, x + 4, y + 5, 4, 6, color);
        rect(ctx, x + 8, y + 7, 3, 2, color);
      }
      function polygon(g, pts, color) {
        g.fillStyle = color;
        g.beginPath();
        pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
        g.closePath();
        g.fill();
      }
      // НОВЫЕ native 32×32. Размер шарика в мире прежний: больше деталей, не гиганты.
      // Мир рисуется в буфер 960×720; пиксель нового спрайта не размывается уменьшением.
      // Свои старые таблицы 16×16 по-прежнему поддерживаются (значение ниже).
      const OVERWORLD_CUSTOM_FRAME_SIZE = 16;
      const PIXEL_ROWS = [
        [6, 10],
        [4, 12],
        [3, 13],
        [2, 14],
        [1, 15],
        [1, 15],
        [0, 16],
        [0, 16],
        [0, 16],
        [0, 16],
        [1, 15],
        [1, 15],
        [2, 14],
        [3, 13],
        [4, 12],
        [6, 10],
      ];
      const worldSpriteCache = new Map();
      function nativeSprite(c, dir) {
        const key = c.id + ':' + dir;
        if (worldSpriteCache.has(key)) return worldSpriteCache.get(key);
        const cv = document.createElement('canvas');
        cv.width = 16;
        cv.height = 16;
        const g = cv.getContext('2d');
        for (let y = 0; y < 16; y++) {
          const [lo, hi] = PIXEL_ROWS[y];
          for (let x = lo; x < hi; x++) {
            const edge = x === lo || x === hi - 1 || y === 0 || y === 15;
            let color = '#221c29';
            if (!edge) {
              if (c.id === 'commonwealth') color = y < 5 || y > 10 ? '#db1735' : '#fff6e8';
              else if (c.id === 'prussia') color = y < 4 || y > 11 ? '#16151c' : '#f4f0e6';
              else if (c.id === 'austrian_empire') color = y < 8 ? '#29252e' : '#eac452';
              else if (c.id === 'ottoman_empire') color = '#b63049';
              else if (c.id === 'saxony') color = y % 4 < 2 ? '#edc45b' : '#27252b';
              else if (c.id === 'venice') color = '#b7344e';
              else if (c.id === 'sweden')
                color = (x >= 5 && x <= 7) || (y >= 6 && y <= 8) ? '#f7cf43' : '#2767a4';
              else color = y < 10 ? '#de4568' : '#b52a4b';
            }
            rect(g, x, y, 1, 1, color);
          }
        }
        if (c.id === 'commonwealth') {
          rect(g, 6, 4, 4, 6, '#e3b54e');
          rect(g, 7, 5, 2, 4, '#b72c3c');
          rect(g, 7, 4, 2, 1, '#f5d878');
        }
        if (c.id === 'prussia') {
          rect(g, 8, 4, 2, 5, '#15141a');
          rect(g, 5, 5, 8, 2, '#15141a');
          rect(g, 7, 3, 2, 1, '#d8b641');
        }
        if (c.id === 'saxony')
          for (let k = 0; k < 9; k++) rect(g, 5 + Math.floor(k / 3), 3 + k, 2, 1, '#79a777');
        if (c.id === 'venice') {
          rect(g, 4, 4, 7, 3, '#e5bd75');
          rect(g, 6, 3, 3, 5, '#f2d18b');
          rect(g, 3, 5, 3, 1, '#f2d18b');
          rect(g, 10, 5, 3, 1, '#f2d18b');
        }
        if (c.id === 'ottoman_empire') {
          rect(g, 3, 5, 3, 4, '#f8ebd5');
          rect(g, 4, 5, 3, 3, '#b63049');
          rect(g, 8, 6, 1, 1, '#f8ebd5');
        }
        if (dir !== 3) {
          const offset = dir === 1 ? -1 : dir === 2 ? 1 : 0;
          for (const ex of [3 + offset, 9 + offset]) {
            rect(g, ex, 9, 4, 5, '#221c29');
            rect(g, ex + 1, 10, 2, 3, '#fff9e8');
          }
        }
        worldSpriteCache.set(key, cv);
        return cv;
      }
      function pixelBall(g, c, x, y, size = 16, portrait = false, dir = 0, walk = 0) {
        const custom = image(OVERWORLD_SPRITES[c.id]);
        g.save();
        g.imageSmoothingEnabled = false;
        const left = Math.round(x - 8),
          top = Math.round(y - 8);
        if (c.id === 'commonwealth' && !custom) {
          for (const side of [-1, 1]) {
            const wx = left + (side < 0 ? -1 : 16);
            rect(g, wx, top, 1, 12, '#78634c');
            for (let i = 0; i < 5; i++) {
              const yy = top + i * 2,
                xx = side < 0 ? wx - 3 : wx + 1;
              rect(g, xx, yy, 3, 2, '#fff2d1');
              rect(g, side < 0 ? xx : xx + 2, yy + 1, 1, 1, '#b5a287');
            }
          }
        }
        if (custom) {
          g.drawImage(custom, (Math.floor(walk) % 3) * 16, dir * 16, 16, 16, left, top, 16, 16);
        } else g.drawImage(nativeSprite(c, dir), left, top);
        g.restore();
      }

      // Векторные портреты: редактируемые кривые, не пиксельный fallback.
      // Флаги/гербы стилизованы для игры, не претендуют на музейную точность.
      function ballPath(g) {
        g.beginPath();
        g.moveTo(-37, -35);
        g.bezierCurveTo(-17, -53, 16, -53, 35, -34);
        g.bezierCurveTo(54, -16, 55, 13, 39, 34);
        g.bezierCurveTo(20, 54, -13, 57, -35, 39);
        g.bezierCurveTo(-55, 22, -55, -12, -37, -35);

            rr = i % 2 ? r * 0.4 : r;
          p.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);

        polygon(g, p, color);
      }
      function eagle(g, x, y, s, color) {
        g.save();
        g.translate(x, y);
        g.scale(s, s);
        g.fillStyle = color;
        g.beginPath();
        g.moveTo(0, -9);
        g.lineTo(3, -13);
        g.lineTo(7, -12);
        g.lineTo(4, -9);
        g.lineTo(4, -5);
        g.lineTo(11, -11);
        g.lineTo(17, -9);
        g.lineTo(12, -6);
        g.lineTo(18, -6);
        g.lineTo(12, -3);
        g.lineTo(17, -3);
        g.lineTo(10, 1);
        g.lineTo(4, 1);
        g.lineTo(6, 9);
        g.lineTo(10, 12);
        g.lineTo(3, 11);
        g.lineTo(0, 15);
        g.lineTo(-3, 11);
        g.lineTo(-10, 12);
        g.lineTo(-6, 9);
        g.lineTo(-4, 1);
        g.lineTo(-10, 1);
        g.lineTo(-17, -3);
        g.lineTo(-12, -3);
        g.lineTo(-18, -6);
        g.lineTo(-12, -6);
        g.lineTo(-17, -9);
        g.lineTo(-11, -11);
        g.lineTo(-4, -5);
        g.lineTo(-4, -9);
        g.lineTo(-7, -12);
        g.lineTo(-3, -13);
        g.closePath();
        g.fill();
        g.restore();
      }
      function drawFlag(g, id) {
        const texture = image(FLAG_TEXTURES[id]);

        // Этот fallback виден только в первые миллисекунды загрузки PNG из data URI.
        if (id === 'commonwealth') {
          rect(g, -60, -60, 120, 120, '#df1236');
          rect(g, -60, -18, 120, 36, '#fff');
        } else if (id === 'austrian_empire') {
          rect(g, -60, -60, 120, 60, '#000');
          rect(g, -60, 0, 120, 60, '#ffdf00');
        } else if (id === 'saxony') {
          rect(g, -60, -60, 120, 120, '#efcb61');
          for (let y = -60; y < 60; y += 20) rect(g, -60, y, 120, 10, '#24242b');
          g.save();
          g.rotate(-0.5);
          rect(g, -8, -70, 16, 140, '#579466');
          g.restore();

            [

              [-24, -44],

              [5, -13],
            ],
            '#eac372',

          g.fillStyle = '#f3cf81';
          g.beginPath();
          g.ellipse(-2, -12, 20, 10, 0, 0, Math.PI * 2);

          rect(g, -60, -10, 120, 15, '#f4cf4c');
        } else if (id === 'prussia') rect(g, -60, -60, 120, 120, '#fff');
        else rect(g, -60, -60, 120, 120, '#b52c41');
      }
      const FACE_PROFILES = {
        commonwealth: { w: 11, h: 14, gap: 19, lid: 0.06, tilt: 0.04, skew: 0.05 },
        prussia: { w: 10.2, h: 10.8, gap: 18, lid: 0.35, tilt: 0.16, skew: 0.01 },
        austrian_empire: { w: 11.3, h: 11.8, gap: 18.5, lid: 0.42, tilt: 0.03, skew: 0.04 },
        ottoman_empire: { w: 12, h: 12, gap: 19, lid: 0.28, tilt: 0.1, skew: 0.1 },
        sweden: { w: 10.5, h: 12, gap: 18, lid: 0.2, tilt: 0.1, skew: 0 },
        saxony: { w: 10, h: 12, gap: 18, lid: 0.3, tilt: 0.12, skew: 0.02 },
        venice: { w: 12, h: 13, gap: 19, lid: 0.2, tilt: 0.04, skew: 0.08 },
        echo: { w: 11, h: 15, gap: 18, lid: 0.15, tilt: 0.02, skew: 0.04 },
      };
      // У каждого характера свой СИЛУЭТ радостных и злых глаз, а не только наклон.
      // Эти функции рисуют только мимику. Численные бонусы зависят исключительно от E.
      function traceHappyEye(g, c, tier, side, w, h) {
        // Symmetrical upward arches: a smile conveyed with eyes, never slanted brows.
        const profile = {
          commonwealth: [1.08, 1.0],
          prussia: [0.94, 0.72],
          austrian_empire: [0.95, 0.9],
          ottoman_empire: [1.12, 0.85],
          sweden: [1.0, 0.85],
        }[c.id] || [1, 1];

        h *= profile[1];
        if (c.id === 'ottoman_empire' && tier >= 2 && side < 0) {
          w *= 0.9;
          h *= 0.75;
        }
        if (tier === 3 && side > 0) h *= 1.2;
        if (c.id === 'commonwealth' && tier === 1) {
          g.beginPath();
          g.ellipse(0, -1, w * 0.92, h * 0.86, 0, 0, Math.PI * 2);

      }

      function traceAngryEye(g, c, tier, side, w, h) {
        const inner = side < 0 ? 1 : -1;
        g.scale(inner, 1);
        g.beginPath();

          const q = tier === 1 ? 0.82 : 0.4;

        if (state.screen === 'targets' && pending?.target === 'enemy') {
          const r = canvas.getBoundingClientRect(), x = (e.clientX-r.left)*640/r.width, y=(e.clientY-r.top)*480/r.height;
          const ops=options(), hit=ops.findIndex(o=> {const p=enemyPosition(o.entity);return Math.hypot(x-p.x,y-p.y)<(o.entity.minion?44:70);});
          if(hit>=0){state.cursor=hit;announce('Цель: '+ops[hit].name);}
          return;
        }
        if (state.followup) {
          const r = canvas.getBoundingClientRect(),
            x = ((e.clientX - r.left) * 640) / r.width,
            y = ((e.clientY - r.top) * 480) / r.height;
          const hit = followLayout().findIndex(
            (b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h,
          );
          if (hit >= 0) chooseFollowup(hit);
        }
      });
      // Pointer capture keeps both thumbs independent, even outside their controls.
      const touchMode = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
      document.body.classList.toggle('touch-mode', touchMode);
      const stage = document.getElementById('game-stage'),
        joystick = document.getElementById('joystick'), stick = document.getElementById('stick');
      const directionCodes = {up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight'};
      let stickPointer = null, stickX = 0, stickY = 0, stickDirs = [], repeatAt = 0;
      const buttonPointers = new Map();
      function touchKey(code, repeat = false) {
        handleKeyDown({code, repeat, preventDefault() {}});
      }
      function desiredDirections() {
        const length = Math.hypot(stickX, stickY);
        if (length < 12) return [];
        if (state.mode !== 'world' || state.dialog) {
          return [Math.abs(stickX) > Math.abs(stickY) ? (stickX > 0 ? 'right' : 'left') : (stickY > 0 ? 'down' : 'up')];
        }
        const dirs = [];
        if (Math.abs(stickX) / length > .4) dirs.push(stickX > 0 ? 'right' : 'left');
        if (Math.abs(stickY) / length > .4) dirs.push(stickY > 0 ? 'down' : 'up');
        return dirs;
      }
      function updateStickInput() {
        const next = desiredDirections();
        for (const d of stickDirs) if (!next.includes(d)) held.delete(d);
        const changed = next.join() !== stickDirs.join();
        for (const d of next) if (!stickDirs.includes(d)) touchKey(directionCodes[d]);
        stickDirs = next;
        if (changed) repeatAt = performance.now() + 360;
      }
      function releaseStick() {
        for (const d of stickDirs) held.delete(d);
        stickDirs = []; stickX = stickY = 0; stickPointer = null;
        stick.style.transform = ''; joystick.classList.remove('active');
      }
      function moveStick(e) {
        const r = joystick.getBoundingClientRect(), max = r.width * .32;
        let x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
        const len = Math.hypot(x, y);
        if (len > max) { x *= max / len; y *= max / len; }
        stickX = x; stickY = y;
        stick.style.transform = `translate(${x}px, ${y}px)`;
        updateStickInput();
      }
      joystick.addEventListener('pointerdown', e => {
        if (stickPointer !== null) return;
        e.preventDefault(); AudioEngine.init();
        stickPointer = e.pointerId; joystick.setPointerCapture(e.pointerId);
        joystick.classList.add('active'); moveStick(e);
      });
      joystick.addEventListener('pointermove', e => {
        if (e.pointerId === stickPointer) { e.preventDefault(); moveStick(e); }
      });
      for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        joystick.addEventListener(event, e => { if (e.pointerId === stickPointer) releaseStick(); });
      }
      for (const button of document.querySelectorAll('.game-button')) {
        button.addEventListener('pointerdown', e => {
          e.preventDefault(); button.setPointerCapture(e.pointerId);
          buttonPointers.set(e.pointerId, button); button.classList.add('pressed');
          touchKey(button.dataset.code);
        });
        const release = e => {
          buttonPointers.delete(e.pointerId);
          if (![...buttonPointers.values()].includes(button)) button.classList.remove('pressed');
        };
        for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(event, release);
        // Keyboard and assistive-technology activation without a preceding pointer.
        button.addEventListener('click', e => { if (e.detail === 0) touchKey(button.dataset.code); });
      }
      function clearTouch() {
        releaseStick(); buttonPointers.clear();
        document.querySelectorAll('.game-button').forEach(b => b.classList.remove('pressed'));
      }
      window.addEventListener('blur', clearTouch);
      document.addEventListener('visibilitychange', () => { if (document.hidden) clearTouch(); });
      document.getElementById('touch-controls').addEventListener('contextmenu', e => e.preventDefault());
      setInterval(() => {
        if (stickPointer === null) return;
        updateStickInput();
        if (performance.now() >= repeatAt) {
          for (const d of stickDirs) touchKey(directionCodes[d], true);
          repeatAt = performance.now() + 180;
        }
      }, 30);
      function resize() {
        const room = Math.min(stage.clientWidth / 640, stage.clientHeight / 480),
          scale = room < 1 ? room : Math.max(1, Math.floor(room * 2) / 2),
          dpr = devicePixelRatio || 1;
        renderScale = scale * dpr;
        canvas.style.width = 640 * scale + 'px';
        canvas.style.height = 480 * scale + 'px';
        canvas.width = Math.round(640 * renderScale);
        canvas.height = Math.round(480 * renderScale);
        ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
      }
      window.addEventListener('resize', () => { clearTouch(); resize(); });
      new ResizeObserver(resize).observe(stage);
      function loop(t) {
        const dt = Math.min(0.04, (t - lastTime) / 1000 || 0);
        lastTime = t;
        clock += dt;
        AudioEngine.pump();
        updateVisuals(dt);
        if (typingActive()) AudioEngine.tick();
        if (state.mode === 'world') movement(dt);
        if (state.mode === 'battle' && state.screen === 'execute') executeNext();
        ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
        ctx.imageSmoothingEnabled = false;
        if (state.mode === 'world') worldDraw();
        else if (state.mode === 'field') fieldDraw();
        else battleDraw();
        if (state.dialog) dialogDraw();
        if (state.mode !== 'battle' && state.dialog) {
          const f = state.effects.findLast((e) => e.type === 'heal' || e.type === 'juice');
          if (f) {
            const t = (clock - f.start) / f.life;
            ctx.save();
            ctx.globalAlpha = Math.sin(t * Math.PI) * 0.75;
            ctx.strokeStyle = f.type === 'heal' ? '#b9ffc8' : '#a2e8ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(16, 321, 608, 143);
            for (let i = 0; i < 5; i++)
              star(ctx, 45 + i * 130, 319 - Math.sin(t * Math.PI) * 9, 3, ctx.strokeStyle, 4);
            ctx.restore();
          }
        }
        if (clock - sceneFade < 0.4) {
          rect(
            ctx,
            0,
            0,
            640,
            480,
            'rgba(0,0,0,' + Math.max(0, 1 - (clock - sceneFade) / 0.4) + ')',
          );
        }
        requestAnimationFrame(loop);
      }
      window.RPG = {
        getState: () =>
          structuredClone({
            ...state,
            dialog: state.dialog ? { text: state.dialog.text, page: state.dialog.page || 0 } : null,
          }),
        startBattle,
        reset,
        applyStoryFear,
        isAnimating: () => !!action,
        audioStats: () => ({
          ...AudioEngine.stats,
          music: AUDIO_CONFIG.music,
          effects: AUDIO_CONFIG.effects,
        }),
      };
      reset();
      resize();
      canvas.focus();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
